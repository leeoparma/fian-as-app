# Roda a suíte de testes da matemática a cada commit.
# Resultado aparece como ✅/❌ ao lado do commit no GitHub.
name: Testes da matemática
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/calc.test.mjs
